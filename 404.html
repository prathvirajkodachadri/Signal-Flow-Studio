<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signal Flow Studio — Audio Level & Mixing Guide</title>
    <meta name="description" content="Interactive audio signal flow visualization. Learn mixing, bus routing, gain staging, and mastering through animated visuals." />
    <script>
      // GitHub Pages serves this repository from its raw branch root, so any
      // missing path (404) under the site lands here. The Vite source at the
      // repo root cannot run in a browser, so route visitors to the prebuilt
      // app in /docs/ instead. Local dev servers use a different hostname and
      // never hit this page's redirect.
      (function () {
        var host = window.location.hostname || '';
        if (!/(^|\.)github\.io$/i.test(host)) return;

        var path = window.location.pathname || '/';
        var target;
        var docsAt = path.toLowerCase().indexOf('/docs/');
        if (docsAt > 0) {
          target = path.slice(0, docsAt) + '/docs/';
        } else {
          var first = path.split('/').filter(Boolean)[0];
          target = (first ? '/' + first : '') + '/docs/';
        }
        window.location.replace(target);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 2rem; color: #333">
        Page not found. Signal Flow Studio's built app lives at
        <a href="./docs/">/docs/</a> on GitHub Pages.
      </p>
    </noscript>
  </body>
</html>
